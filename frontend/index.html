<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeArena — Practice &amp; Master Coding</title>
  <meta name="description" content="An interactive coding platform to practice problems, run code, and track your submissions." />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async
          onload="if(typeof initGoogleAuth==='function') initGoogleAuth()"></script>
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────── -->
  <nav class="navbar">
    <a class="navbar-brand" href="index.html">
      <div class="brand-icon">⚡</div>
      CodeArena
    </a>
    <div class="navbar-links">
      <a class="nav-link active" href="index.html">Problems</a>
      <a class="nav-link" href="exam.html" style="font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:4px">🎓 Placement Exam</a>
      <a class="nav-link" id="admin-nav-link" href="admin.html" style="display:none">Admin</a>
      <!-- Auth chip — populated by auth.js -->
      <div class="auth-chip" id="auth-chip"></div>
    </div>
  </nav>

  <!-- ── Main ────────────────────────────────────────────── -->
  <main class="container">

    <!-- Hero -->
    <section class="hero">
      <h1 class="hero-title">Sharpen Your Coding Skills</h1>
      <p class="hero-subtitle">Write code, run it against real test cases, and take official Placement Assessment Tests.</p>
      <div style="margin-top:16px;">
        <a href="exam.html" class="btn btn-primary" style="padding:12px 24px;font-size:15px;text-decoration:none;display:inline-block">⚡ Start Placement Test (30 MCQs + 3 Coding) →</a>
      </div>
    </section>

    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="stat-total">–</div>
        <div class="stat-label">Problems</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-easy">–</div>
        <div class="stat-label">Easy</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-medium">–</div>
        <div class="stat-label">Medium</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-hard">–</div>
        <div class="stat-label">Hard</div>
      </div>
    </div>

    <!-- Filters + Search -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="All">All</button>
      <button class="filter-btn" data-filter="Easy">Easy</button>
      <button class="filter-btn" data-filter="Medium">Medium</button>
      <button class="filter-btn" data-filter="Hard">Hard</button>
      <input type="text" class="search-input" id="search-input" placeholder="Search by #number, title, or keyword..." />
    </div>

    <!-- Question Grid -->
    <div class="question-grid" id="question-grid">
      <!-- Populated by main.js -->
      <div class="skeleton" style="height:160px;"></div>
      <div class="skeleton" style="height:160px;"></div>
      <div class="skeleton" style="height:160px;"></div>
    </div>

  </main>

  <!-- ── Toast container ──────────────────────────────────── -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
